{% extends "base.html" %}
{% block title %}Crear cuenta{% endblock %}

{% block extra_css %}
<style>
.auth-wrapper {
  min-height: calc(100vh - 60px);
  display: flex; align-items: center; justify-content: center;
  padding: 2rem 1rem;
}
.auth-card {
  width: 100%; max-width: 460px;
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: 16px;
  padding: 2.5rem 2rem;
}
.auth-title { font-size: 1.5rem; font-weight: 700; margin-bottom: .3rem; }
.auth-sub   { color: var(--text-muted); font-size: .875rem; margin-bottom: 2rem; }
.auth-footer{ text-align: center; margin-top: 1.25rem; font-size: .875rem; color: var(--text-muted); }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h1 class="auth-title">Crear cuenta</h1>
    <p class="auth-sub">Registrate para solicitar turnos en línea.</p>

    <form method="POST" action="{{ url_for('auth.registro_cliente_view', url_id=url_id) }}">
      <div class="form-group">
        <label class="form-label">Nombre completo</label>
        <input type="text" name="nombre" class="form-control" placeholder="Juan Pérez" required autofocus />
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" placeholder="tu@email.com" required />
      </div>
      <div class="form-group">
        <label class="form-label">Teléfono</label>
        <input type="tel" name="telefono" class="form-control" placeholder="Ej: 1123456789" required />
      </div>
      <div class="grid grid-2" style="gap:.75rem">
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label">Contraseña</label>
          <input type="password" name="password" class="form-control" placeholder="Mín. 6 caracteres" required />
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label">Repetir contraseña</label>
          <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required />
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:1.25rem;">
        Crear cuenta
      </button>
    </form>

    <div class="auth-footer">
      ¿Ya tenés cuenta? <a href="{{ url_for('auth.login_cliente_view', url_id=url_id) }}">Iniciar sesión</a>
    </div>
  </div>
</div>
{% endblock %}
