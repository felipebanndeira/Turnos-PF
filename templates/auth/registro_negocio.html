{% extends "base.html" %}
{% block title %}Registrar mi negocio{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - 60px); display: flex; align-items: center; justify-content: center; padding: 2rem;">
  <div class="auth-card animate-up" style="max-width: 500px;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <i data-lucide="building" style="width: 48px; height: 48px; color: var(--accent); margin-bottom: 1rem;"></i>
      <h1 class="auth-title">Crea tu Plataforma</h1>
      <p class="auth-subtitle">Empezá a gestionar tus turnos hoy mismo.</p>
    </div>

    <form method="POST" action="{{ url_for('auth.registro_negocio_view') }}">
      <div class="form-group">
        <label class="form-label">Nombre de tu Negocio</label>
        <input type="text" name="nombre" class="form-control" placeholder="Ej: Barbería Pepe" required autofocus />
      </div>
      <div class="form-group">
        <label class="form-label">URL única para tus clientes</label>
        <div style="display:flex; align-items:center;">
          <span style="color:var(--text-muted); background:var(--bg-input); border:1px solid var(--border); padding: 0.75rem; border-right:none; border-radius: var(--radius) 0 0 var(--radius);">tus-turnos.com/</span>
          <input type="text" name="url_id" class="form-control" placeholder="barberia-pepe" style="border-radius: 0 var(--radius) var(--radius) 0;" required />
        </div>
        <small class="text-muted" style="margin-top:0.25rem; display:block;">Este será el link que le enviarás a tus clientes.</small>
      </div>
      <div class="form-group">
        <label class="form-label">Email (Usuario administrador)</label>
        <input type="email" name="email" class="form-control" placeholder="tucorreo@empresa.com" required />
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Registrar y Comenzar</button>
      
      <p class="text-center text-muted" style="margin-top: 1.5rem; font-size: 0.9rem;">
        ¿Ya tienes una cuenta? <a href="{{ url_for('auth.login_admin_view') }}">Inicia sesión</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
