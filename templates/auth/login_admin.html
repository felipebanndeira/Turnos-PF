{% extends "base.html" %}
{% block title %}Admin — Acceso{% endblock %}

{% block extra_css %}
<style>
.auth-wrapper {
  min-height: calc(100vh - 60px);
  display: flex; align-items: center; justify-content: center;
  padding: 2rem 1rem;
}
.auth-card {
  width: 100%; max-width: 400px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2.5rem 2rem;
  position: relative;
  overflow: hidden;
}
.auth-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--indigo), var(--emerald));
}
.auth-badge {
  display: inline-flex; align-items: center; gap: .4rem;
  background: var(--amber-glow); color: var(--amber);
  font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
  padding: .25rem .7rem; border-radius: 20px;
  margin-bottom: 1.5rem;
}
.auth-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 2rem; }
.auth-footer { text-align: center; margin-top: 1.25rem; font-size: .82rem; color: var(--text-muted); }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-badge">🔒 Panel restringido</div>
    <h1 class="auth-title">Acceso de Administrador</h1>

    <form method="POST" action="{{ url_for('auth.login_admin_view') }}">
        <div class="form-group">
          <label class="form-label">Email del Negocio</label>
          <input type="email" name="email" class="form-control" placeholder="admin@mi-negocio.com" required autofocus />
        </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:.5rem;">
        Ingresar al panel
      </button>
    </form>

    <div class="auth-footer" style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
      <a href="{{ url_for('auth.index') }}">← Volver al inicio</a>
    </div>
  </div>
</div>
{% endblock %}
